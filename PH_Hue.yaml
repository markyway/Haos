blueprint:
  name: Philips Hue Dimmer v2 - Native Style (Zigbee2MQTT)
  description: >
    Native-style Philips Hue Dimmer v2 blueprint for Zigbee2MQTT.

    Behavior:
    - On button: turn lights on
    - Off button: turn lights off
    - Brightness up/down short press: ~12% step
    - Brightness up/down hold: smooth dim/brighten until release
    - Hue button: alternate between Scene 0 and Scene 1

  domain: automation

  input:
    remote_device:
      name: Remote device
      description: Select the Philips Hue dimmer device.
      selector:
        device:
          integration: mqtt

    target_lights:
      name: Target lights
      selector:
        entity:
          domain: light
          multiple: true

    hue_scene_0:
      name: Hue Scene 0
      description: Scene to activate when the remote sends recall_0.
      selector:
        entity:
          domain: scene

    hue_scene_1:
      name: Hue Scene 1
      description: Scene to activate when the remote sends recall_1.
      selector:
        entity:
          domain: scene

    click_step_pct:
      name: Click brightness step
      description: Native Hue dimmer is about 12%.
      default: 12
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"

    hold_step_pct:
      name: Hold brightness step
      description: Native Hue dimmer is about 25%.
      default: 25
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"

    hold_repeat_ms:
      name: Hold repeat delay
      default: 200
      selector:
        number:
          min: 100
          max: 1000
          step: 10
          unit_of_measurement: ms

mode: single
max_exceeded: silent

variables:
  target_lights: !input target_lights
  click_step_pct: !input click_step_pct
  hold_step_pct: !input hold_step_pct

trigger:
  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: on_press_release
    id: on_press_release

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: off_press_release
    id: off_press_release

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: up_press_release
    id: up_press_release

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: up_hold
    id: up_hold

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: down_press_release
    id: down_press_release

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: down_hold
    id: down_hold

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: recall_0
    id: recall_0

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: recall_1
    id: recall_1

action:
  - choose:
      - conditions:
          - condition: trigger
            id: on_press_release
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input target_lights

      - conditions:
          - condition: trigger
            id: off_press_release
        sequence:
          - service: light.turn_off
            target:
              entity_id: !input target_lights

      - conditions:
          - condition: trigger
            id: up_press_release
        sequence:
          - variables:
              first_light: "{{ expand(target_lights) | map(attribute='entity_id') | list | first }}"
              current_brightness: "{{ state_attr(first_light, 'brightness') | int(0) }}"
              step_brightness: "{{ ((click_step_pct | float(0)) * 2.55) | round(0) | int }}"
              new_brightness: "{{ [current_brightness + step_brightness, 255] | min }}"
          - service: light.turn_on
            target:
              entity_id: !input target_lights
            data:
              brightness: "{{ new_brightness }}"

      - conditions:
          - condition: trigger
            id: down_press_release
        sequence:
          - variables:
              any_on: "{{ expand(target_lights) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
          - condition: template
            value_template: "{{ any_on }}"
          - variables:
              first_light: "{{ expand(target_lights) | map(attribute='entity_id') | list | first }}"
              current_brightness: "{{ state_attr(first_light, 'brightness') | int(1) }}"
              step_brightness: "{{ ((click_step_pct | float(0)) * 2.55) | round(0) | int }}"
              new_brightness: "{{ [current_brightness - step_brightness, 1] | max }}"
          - service: light.turn_on
            target:
              entity_id: !input target_lights
            data:
              brightness: "{{ new_brightness }}"

      - conditions:
          - condition: trigger
            id: up_hold
        sequence:
          - repeat:
              sequence:
                - variables:
                    first_light: "{{ expand(target_lights) | map(attribute='entity_id') | list | first }}"
                    current_brightness: "{{ state_attr(first_light, 'brightness') | int(0) }}"
                    step_brightness: "{{ ((hold_step_pct | float(0)) * 2.55) | round(0) | int }}"
                    new_brightness: "{{ [current_brightness + step_brightness, 255] | min }}"
                - service: light.turn_on
                  target:
                    entity_id: !input target_lights
                  data:
                    brightness: "{{ new_brightness }}"
                - wait_for_trigger:
                    - platform: device
                      domain: mqtt
                      device_id: !input remote_device
                      type: action
                      subtype: up_hold_release
                  timeout:
                    milliseconds: !input hold_repeat_ms
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"

      - conditions:
          - condition: trigger
            id: down_hold
        sequence:
          - variables:
              any_on: "{{ expand(target_lights) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
          - condition: template
            value_template: "{{ any_on }}"
          - repeat:
              sequence:
                - variables:
                    first_light: "{{ expand(target_lights) | map(attribute='entity_id') | list | first }}"
                    current_brightness: "{{ state_attr(first_light, 'brightness') | int(1) }}"
                    step_brightness: "{{ ((hold_step_pct | float(0)) * 2.55) | round(0) | int }}"
                    new_brightness: "{{ [current_brightness - step_brightness, 1] | max }}"
                - service: light.turn_on
                  target:
                    entity_id: !input target_lights
                  data:
                    brightness: "{{ new_brightness }}"
                - wait_for_trigger:
                    - platform: device
                      domain: mqtt
                      device_id: !input remote_device
                      type: action
                      subtype: down_hold_release
                  timeout:
                    milliseconds: !input hold_repeat_ms
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"

      - conditions:
          - condition: trigger
            id: recall_0
        sequence:
          - service: scene.turn_on
            target:
              entity_id: !input hue_scene_0

      - conditions:
          - condition: trigger
            id: recall_1
        sequence:
          - service: scene.turn_on
            target:
              entity_id: !input hue_scene_1
