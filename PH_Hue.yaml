alias: Philips Hue Dimmer Hardcoded Stable
description: Hardcoded fast automation for Philips Hue Dimmer RWL022 on Zigbee2MQTT
mode: restart
max_exceeded: silent

variables:
  target_lights: light.your_light_group
  color_helper: input_number.hue_dimmer_color_index

  min_brightness_pct: 10
  tap_step_pct: 10
  hold_step_pct: 6
  hold_delay_ms: 140

  warm_kelvin: 2200
  cold_kelvin: 6500
  ct_steps: 18
  ct_delay_ms: 220

trigger:
  - platform: mqtt
    topic: zigbee2mqtt/ph_controle_01
    payload: on_press_release
    value_template: "{{ value_json.action }}"
    id: toggle

  - platform: mqtt
    topic: zigbee2mqtt/ph_controle_01
    payload: on_hold
    value_template: "{{ value_json.action }}"
    id: ct_hold

  - platform: mqtt
    topic: zigbee2mqtt/ph_controle_01
    payload: up_press
    value_template: "{{ value_json.action }}"
    id: up_press

  - platform: mqtt
    topic: zigbee2mqtt/ph_controle_01
    payload: down_press
    value_template: "{{ value_json.action }}"
    id: down_press

  - platform: mqtt
    topic: zigbee2mqtt/ph_controle_01
    payload: up_hold
    value_template: "{{ value_json.action }}"
    id: up_hold

  - platform: mqtt
    topic: zigbee2mqtt/ph_controle_01
    payload: down_hold
    value_template: "{{ value_json.action }}"
    id: down_hold

  - platform: mqtt
    topic: zigbee2mqtt/ph_controle_01
    payload: off_press
    value_template: "{{ value_json.action }}"
    id: hue_press

action:
  - choose:
      - conditions:
          - condition: trigger
            id: toggle
        sequence:
          - service: light.toggle
            target:
              entity_id: "{{ target_lights }}"

      - conditions:
          - condition: trigger
            id: ct_hold
        sequence:
          - repeat:
              sequence:
                - variables:
                    step_count: "{{ [ct_steps | int, 2] | max }}"
                    max_index: "{{ step_count - 1 }}"
                    phase: "{{ (repeat.index - 1) % (max_index * 2) }}"
                    step_index: >-
                      {% set m = max_index | int %}
                      {% set p = phase | int %}
                      {% if p <= m %}
                        {{ p }}
                      {% else %}
                        {{ (m * 2) - p }}
                      {% endif %}
                    kelvin_value: >-
                      {% set warm = warm_kelvin | int %}
                      {% set cold = cold_kelvin | int %}
                      {% set m = max_index | int %}
                      {% set idx = step_index | int %}
                      {% if m <= 0 %}
                        {{ warm }}
                      {% else %}
                        {{ (warm + ((cold - warm) * idx / m)) | round(0) | int }}
                      {% endif %}
                - service: light.turn_on
                  target:
                    entity_id: "{{ target_lights }}"
                  data:
                    color_temp_kelvin: "{{ kelvin_value }}"
                    transition: 0
                - wait_for_trigger:
                    - platform: mqtt
                      topic: zigbee2mqtt/ph_controle_01
                      payload: on_hold_release
                      value_template: "{{ value_json.action }}"
                  timeout:
                    milliseconds: "{{ ct_delay_ms }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"

      - conditions:
          - condition: trigger
            id: up_press
        sequence:
          - variables:
              any_on: "{{ expand(target_lights) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ any_on }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      brightness_step_pct: "{{ tap_step_pct }}"
                      transition: 0
            default:
              - service: light.turn_on
                target:
                  entity_id: "{{ target_lights }}"
                data:
                  brightness_pct: "{{ [tap_step_pct, min_brightness_pct] | max }}"
                  transition: 0

      - conditions:
          - condition: trigger
            id: down_press
        sequence:
          - variables:
              first_on_light: >-
                {{ expand(target_lights)
                   | selectattr('state', 'eq', 'on')
                   | map(attribute='entity_id')
                   | list
                   | first }}
          - condition: template
            value_template: "{{ first_on_light is not none }}"
          - variables:
              current_pct: >-
                {{ ((state_attr(first_on_light, 'brightness') | int(1)) / 2.55) | round(0) | int }}
              target_pct: >-
                {{ [current_pct - tap_step_pct, min_brightness_pct] | max }}
          - service: light.turn_on
            target:
              entity_id: "{{ target_lights }}"
            data:
              brightness_pct: "{{ target_pct }}"
              transition: 0

      - conditions:
          - condition: trigger
            id: up_hold
        sequence:
          - variables:
              any_on: "{{ expand(target_lights) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not any_on }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      brightness_pct: "{{ [min_brightness_pct + hold_step_pct, 100] | min }}"
                      transition: 0
          - repeat:
              sequence:
                - service: light.turn_on
                  target:
                    entity_id: "{{ target_lights }}"
                  data:
                    brightness_step_pct: "{{ hold_step_pct }}"
                    transition: 0
                - wait_for_trigger:
                    - platform: mqtt
                      topic: zigbee2mqtt/ph_controle_01
                      payload: up_hold_release
                      value_template: "{{ value_json.action }}"
                  timeout:
                    milliseconds: "{{ hold_delay_ms }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"

      - conditions:
          - condition: trigger
            id: down_hold
        sequence:
          - variables:
              first_on_light: >-
                {{ expand(target_lights)
                   | selectattr('state', 'eq', 'on')
                   | map(attribute='entity_id')
                   | list
                   | first }}
          - condition: template
            value_template: "{{ first_on_light is not none }}"
          - repeat:
              sequence:
                - variables:
                    loop_light: >-
                      {{ expand(target_lights)
                         | selectattr('state', 'eq', 'on')
                         | map(attribute='entity_id')
                         | list
                         | first }}
                    current_pct: >-
                      {{ ((state_attr(loop_light, 'brightness') | int(1)) / 2.55) | round(0) | int }}
                    target_pct: >-
                      {{ [current_pct - hold_step_pct, min_brightness_pct] | max }}
                - service: light.turn_on
                  target:
                    entity_id: "{{ target_lights }}"
                  data:
                    brightness_pct: "{{ target_pct }}"
                    transition: 0
                - wait_for_trigger:
                    - platform: mqtt
                      topic: zigbee2mqtt/ph_controle_01
                      payload: down_hold_release
                      value_template: "{{ value_json.action }}"
                  timeout:
                    milliseconds: "{{ hold_delay_ms }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"

      - conditions:
          - condition: trigger
            id: hue_press
        sequence:
          - variables:
              current_index: "{{ states(color_helper) | int(0) }}"
              color_index: "{{ current_index % 9 }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 0 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [255, 255, 255]
                      transition: 0

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 1 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [245, 245, 80]
                      transition: 0

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 2 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [255, 179, 44]
                      transition: 0

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 3 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [255, 80, 40]
                      transition: 0

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 4 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [235, 60, 120]
                      transition: 0

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 5 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [160, 50, 255]
                      transition: 0

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 6 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [40, 60, 255]
                      transition: 0

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 7 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [45, 110, 170]
                      transition: 0

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 8 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [110, 235, 70]
                      transition: 0

          - service: input_number.set_value
            target:
              entity_id: "{{ color_helper }}"
            data:
              value: "{{ (current_index + 1) % 9 }}"
