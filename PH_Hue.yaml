blueprint:
  name: Philips Hue Dimmer v2 Simple
  description: "Simple Philips Hue Dimmer blueprint for Zigbee2MQTT"
  domain: automation

  input:
    remote_device:
      name: Remote device
      selector:
        device:
          integration: mqtt

    target_lights:
      name: Target lights
      selector:
        entity:
          domain: light
          multiple: true

    color_index_helper:
      name: Color index helper
      selector:
        entity:
          domain: input_number

    short_step_pct:
      name: Short press brightness step
      default: 12
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"

    hold_step_pct:
      name: Hold brightness step
      default: 25
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"

    hold_delay_ms:
      name: Hold repeat delay
      default: 200
      selector:
        number:
          min: 100
          max: 1000
          step: 10
          unit_of_measurement: ms

    color_0:
      name: Color 0
      default: [255, 255, 255]
      selector:
        color_rgb:

    color_1:
      name: Color 1
      default: [245, 245, 80]
      selector:
        color_rgb:

    color_2:
      name: Color 2
      default: [255, 179, 44]
      selector:
        color_rgb:

    color_3:
      name: Color 3
      default: [255, 80, 40]
      selector:
        color_rgb:

    color_4:
      name: Color 4
      default: [235, 60, 120]
      selector:
        color_rgb:

    color_5:
      name: Color 5
      default: [160, 50, 255]
      selector:
        color_rgb:

    color_6:
      name: Color 6
      default: [40, 60, 255]
      selector:
        color_rgb:

    color_7:
      name: Color 7
      default: [45, 110, 170]
      selector:
        color_rgb:

    color_8:
      name: Color 8
      default: [110, 235, 70]
      selector:
        color_rgb:

mode: single
max_exceeded: silent

variables:
  target_lights: !input target_lights
  color_index_helper: !input color_index_helper
  short_step_pct: !input short_step_pct
  hold_step_pct: !input hold_step_pct

trigger:
  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: on_press_release
    id: toggle

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: up_press_release
    id: up_press

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: down_press_release
    id: down_press

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: up_hold
    id: up_hold

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: down_hold
    id: down_hold

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: off_press_release
    id: hue_cycle

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: toggle
        sequence:
          - service: light.toggle
            target:
              entity_id: !input target_lights

      - conditions:
          - condition: trigger
            id: up_press
        sequence:
          - variables:
              first_light: >-
                {{ expand(target_lights) | map(attribute='entity_id') | list | first }}
              current_brightness: >-
                {{ state_attr(first_light, 'brightness') | int(0) }}
              step_brightness: >-
                {{ ((short_step_pct | float(0)) * 2.55) | round(0) | int }}
              new_brightness: >-
                {{ [current_brightness + step_brightness, 255] | min }}
          - service: light.turn_on
            target:
              entity_id: !input target_lights
            data:
              brightness: "{{ new_brightness }}"

      - conditions:
          - condition: trigger
            id: down_press
        sequence:
          - variables:
              first_on_light: >-
                {{ expand(target_lights)
                   | selectattr('state', 'eq', 'on')
                   | map(attribute='entity_id')
                   | list
                   | first }}
          - condition: template
            value_template: "{{ first_on_light is not none }}"
          - variables:
              current_brightness: >-
                {{ state_attr(first_on_light, 'brightness') | int(1) }}
              step_brightness: >-
                {{ ((short_step_pct | float(0)) * 2.55) | round(0) | int }}
              new_brightness: >-
                {{ [current_brightness - step_brightness, 1] | max }}
          - service: light.turn_on
            target:
              entity_id: !input target_lights
            data:
              brightness: "{{ new_brightness }}"

      - conditions:
          - condition: trigger
            id: up_hold
        sequence:
          - repeat:
              sequence:
                - variables:
                    first_light: >-
                      {{ expand(target_lights) | map(attribute='entity_id') | list | first }}
                    current_brightness: >-
                      {{ state_attr(first_light, 'brightness') | int(0) }}
                    step_brightness: >-
                      {{ ((hold_step_pct | float(0)) * 2.55) | round(0) | int }}
                    new_brightness: >-
                      {{ [current_brightness + step_brightness, 255] | min }}
                - service: light.turn_on
                  target:
                    entity_id: !input target_lights
                  data:
                    brightness: "{{ new_brightness }}"
                - wait_for_trigger:
                    - platform: device
                      domain: mqtt
                      device_id: !input remote_device
                      type: action
                      subtype: up_hold_release
                  timeout:
                    milliseconds: !input hold_delay_ms
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"

      - conditions:
          - condition: trigger
            id: down_hold
        sequence:
          - variables:
              first_on_light: >-
                {{ expand(target_lights)
                   | selectattr('state', 'eq', 'on')
                   | map(attribute='entity_id')
                   | list
                   | first }}
          - condition: template
            value_template: "{{ first_on_light is not none }}"
          - repeat:
              sequence:
                - variables:
                    loop_first_on_light: >-
                      {{ expand(target_lights)
                         | selectattr('state', 'eq', 'on')
                         | map(attribute='entity_id')
                         | list
                         | first }}
                    current_brightness: >-
                      {{ state_attr(loop_first_on_light, 'brightness') | int(1) }}
                    step_brightness: >-
                      {{ ((hold_step_pct | float(0)) * 2.55) | round(0) | int }}
                    new_brightness: >-
                      {{ [current_brightness - step_brightness, 1] | max }}
                - service: light.turn_on
                  target:
                    entity_id: !input target_lights
                  data:
                    brightness: "{{ new_brightness }}"
                - wait_for_trigger:
                    - platform: device
                      domain: mqtt
                      device_id: !input remote_device
                      type: action
                      subtype: down_hold_release
                  timeout:
                    milliseconds: !input hold_delay_ms
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"

      - conditions:
          - condition: trigger
            id: hue_cycle
        sequence:
          - variables:
              current_index: "{{ states(color_index_helper) | int(0) }}"
              color_index: "{{ current_index % 9 }}"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 0 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_0

              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 1 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_1

              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 2 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_2

              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 3 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_3

              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 4 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_4

              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 5 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_5

              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 6 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_6

              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 7 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_7

              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 8 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_8

          - service: input_number.set_value
            target:
              entity_id: !input color_index_helper
            data:
              value: "{{ (current_index + 1) % 9 }}"
