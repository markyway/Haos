blueprint:
  name: Philips Hue Dimmer v2 Simple Stable
  description: >
    Philips Hue Dimmer v2 for Zigbee2MQTT.

    - On press release: toggle lights
    - On hold: ping-pong color temperature warm to cold until release
    - Up press: brighten
    - Down press: dim, but never below 10%
    - Up hold: brighten smoothly
    - Down hold: dim smoothly, but never below 10%
    - Off press release: cycle colors
  domain: automation
  input:
    remote_device:
      name: Remote device
      selector:
        device:
          integration: mqtt

    target_lights:
      name: Target lights
      selector:
        entity:
          domain: light
          multiple: true

    color_index_helper:
      name: Color index helper
      selector:
        entity:
          domain: input_number

    short_step_pct:
      name: Brightness step %
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"

    hold_step_pct:
      name: Hold brightness step %
      default: 6
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"

    min_brightness_pct:
      name: Minimum brightness %
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"

    hold_delay_ms:
      name: Hold brightness speed
      default: 140
      selector:
        number:
          min: 80
          max: 1000
          step: 10
          unit_of_measurement: ms

    warm_kelvin:
      name: Warm color temperature
      default: 2200
      selector:
        number:
          min: 1800
          max: 4000
          step: 100
          unit_of_measurement: K

    cold_kelvin:
      name: Cold color temperature
      default: 6500
      selector:
        number:
          min: 3000
          max: 7000
          step: 100
          unit_of_measurement: K

    ct_steps:
      name: Color temperature steps
      default: 18
      selector:
        number:
          min: 2
          max: 50
          step: 1

    ct_delay_ms:
      name: Color temperature speed
      default: 220
      selector:
        number:
          min: 80
          max: 1500
          step: 10
          unit_of_measurement: ms

    color_0:
      name: Color 0
      default: [255, 255, 255]
      selector:
        color_rgb:

    color_1:
      name: Color 1
      default: [245, 245, 80]
      selector:
        color_rgb:

    color_2:
      name: Color 2
      default: [255, 179, 44]
      selector:
        color_rgb:

    color_3:
      name: Color 3
      default: [255, 80, 40]
      selector:
        color_rgb:

    color_4:
      name: Color 4
      default: [235, 60, 120]
      selector:
        color_rgb:

    color_5:
      name: Color 5
      default: [160, 50, 255]
      selector:
        color_rgb:

    color_6:
      name: Color 6
      default: [40, 60, 255]
      selector:
        color_rgb:

    color_7:
      name: Color 7
      default: [45, 110, 170]
      selector:
        color_rgb:

    color_8:
      name: Color 8
      default: [110, 235, 70]
      selector:
        color_rgb:

mode: restart
max_exceeded: silent

variables:
  target_lights: !input target_lights
  color_index_helper: !input color_index_helper
  short_step_pct: !input short_step_pct
  hold_step_pct: !input hold_step_pct
  min_brightness_pct: !input min_brightness_pct
  warm_kelvin: !input warm_kelvin
  cold_kelvin: !input cold_kelvin
  ct_steps: !input ct_steps

trigger:
  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: on_press_release
    id: toggle

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: on_hold
    id: ct_cycle

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: up_press
    id: up_press

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: down_press
    id: down_press

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: up_hold
    id: up_hold

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: down_hold
    id: down_hold

  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: off_press_release
    id: hue_cycle

action:
  - choose:
      - conditions:
          - condition: trigger
            id: toggle
        sequence:
          - service: light.toggle
            target:
              entity_id: !input target_lights

      - conditions:
          - condition: trigger
            id: ct_cycle
        sequence:
          - repeat:
              sequence:
                - variables:
                    step_count: "{{ [ct_steps | int, 2] | max }}"
                    max_index: "{{ step_count - 1 }}"
                    phase: "{{ (repeat.index - 1) % (max_index * 2) }}"
                    step_index: >-
                      {% set m = max_index | int %}
                      {% set p = phase | int %}
                      {% if p <= m %}
                        {{ p }}
                      {% else %}
                        {{ (m * 2) - p }}
                      {% endif %}
                    kelvin_value: >-
                      {% set warm = warm_kelvin | int %}
                      {% set cold = cold_kelvin | int %}
                      {% set m = max_index | int %}
                      {% set idx = step_index | int %}
                      {% if m <= 0 %}
                        {{ warm }}
                      {% else %}
                        {{ (warm + ((cold - warm) * idx / m)) | round(0) | int }}
                      {% endif %}
                - service: light.turn_on
                  target:
                    entity_id: !input target_lights
                  data:
                    color_temp_kelvin: "{{ kelvin_value }}"
                    transition: 0
                - wait_for_trigger:
                    - platform: device
                      domain: mqtt
                      device_id: !input remote_device
                      type: action
                      subtype: on_hold_release
                  timeout:
                    milliseconds: !input ct_delay_ms
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"

      - conditions:
          - condition: trigger
            id: up_press
        sequence:
          - variables:
              any_on: "{{ expand(target_lights) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
              start_pct: "{{ [short_step_pct | int, min_brightness_pct | int] | max }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ any_on }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      brightness_step_pct: "{{ short_step_pct | int }}"
                      transition: 0
            default:
              - service: light.turn_on
                target:
                  entity_id: !input target_lights
                data:
                  brightness_pct: "{{ start_pct }}"
                  transition: 0

      - conditions:
          - condition: trigger
            id: down_press
        sequence:
          - variables:
              first_on_light: >-
                {{ expand(target_lights)
                   | selectattr('state', 'eq', 'on')
                   | map(attribute='entity_id')
                   | list
                   | first }}
          - condition: template
            value_template: "{{ first_on_light is not none }}"
          - variables:
              current_pct: >-
                {{ ((state_attr(first_on_light, 'brightness') | int(1)) / 2.55) | round(0) | int }}
              target_pct: >-
                {{ [current_pct - (short_step_pct | int), min_brightness_pct | int] | max }}
          - service: light.turn_on
            target:
              entity_id: !input target_lights
            data:
              brightness_pct: "{{ target_pct }}"
              transition: 0

      - conditions:
          - condition: trigger
            id: up_hold
        sequence:
          - variables:
              any_on: "{{ expand(target_lights) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not any_on }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      brightness_pct: "{{ [min_brightness_pct | int + hold_step_pct | int, 100] | min }}"
                      transition: 0
          - repeat:
              sequence:
                - service: light.turn_on
                  target:
                    entity_id: !input target_lights
                  data:
                    brightness_step_pct: "{{ hold_step_pct | int }}"
                    transition: 0
                - wait_for_trigger:
                    - platform: device
                      domain: mqtt
                      device_id: !input remote_device
                      type: action
                      subtype: up_hold_release
                  timeout:
                    milliseconds: !input hold_delay_ms
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"

      - conditions:
          - condition: trigger
            id: down_hold
        sequence:
          - variables:
              first_on_light: >-
                {{ expand(target_lights)
                   | selectattr('state', 'eq', 'on')
                   | map(attribute='entity_id')
                   | list
                   | first }}
          - condition: template
            value_template: "{{ first_on_light is not none }}"
          - repeat:
              sequence:
                - variables:
                    loop_light: >-
                      {{ expand(target_lights)
                         | selectattr('state', 'eq', 'on')
                         | map(attribute='entity_id')
                         | list
                         | first }}
                    current_pct: >-
                      {{ ((state_attr(loop_light, 'brightness') | int(1)) / 2.55) | round(0) | int }}
                    target_pct: >-
                      {{ [current_pct - (hold_step_pct | int), min_brightness_pct | int] | max }}
                - service: light.turn_on
                  target:
                    entity_id: !input target_lights
                  data:
                    brightness_pct: "{{ target_pct }}"
                    transition: 0
                - wait_for_trigger:
                    - platform: device
                      domain: mqtt
                      device_id: !input remote_device
                      type: action
                      subtype: down_hold_release
                  timeout:
                    milliseconds: !input hold_delay_ms
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"

      - conditions:
          - condition: trigger
            id: hue_cycle
        sequence:
          - variables:
              current_index: "{{ states(color_index_helper) | int(0) }}"
              color_index: "{{ current_index % 9 }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 0 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_0
                      transition: 0
              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 1 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_1
                      transition: 0
              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 2 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_2
                      transition: 0
              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 3 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_3
                      transition: 0
              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 4 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_4
                      transition: 0
              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 5 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_5
                      transition: 0
              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 6 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_6
                      transition: 0
              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 7 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_7
                      transition: 0
              - conditions:
                  - condition: template
                    value_template: "{{ color_index | int == 8 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input target_lights
                    data:
                      rgb_color: !input color_8
                      transition: 0
          - service: input_number.set_value
            target:
              entity_id: !input color_index_helper
            data:
              value: "{{ (current_index + 1) % 9 }}"
