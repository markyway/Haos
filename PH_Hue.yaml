alias: Philips Hue Dimmer - Simple MQTT
description: Simple control for Philips Hue Dimmer v2 via Zigbee2MQTT
mode: single

variables:
  mqtt_topic: zigbee2mqtt/ph_controle_01
  target_lights:
    - light.hallway_lights
  color_helper: input_number.styrbar_color_index
  short_step_pct: 12
  hold_step_pct: 25
  hold_delay_ms: 200

trigger:
  - platform: mqtt
    topic: "{{ mqtt_topic }}"
    payload: "on_press_release"
    value_template: "{{ value_json.action }}"
    id: toggle_on

  - platform: mqtt
    topic: "{{ mqtt_topic }}"
    payload: "off_press_release"
    value_template: "{{ value_json.action }}"
    id: toggle_off

  - platform: mqtt
    topic: "{{ mqtt_topic }}"
    payload: "up_press_release"
    value_template: "{{ value_json.action }}"
    id: up_press

  - platform: mqtt
    topic: "{{ mqtt_topic }}"
    payload: "down_press_release"
    value_template: "{{ value_json.action }}"
    id: down_press

  - platform: mqtt
    topic: "{{ mqtt_topic }}"
    payload: "up_hold"
    value_template: "{{ value_json.action }}"
    id: up_hold

  - platform: mqtt
    topic: "{{ mqtt_topic }}"
    payload: "down_hold"
    value_template: "{{ value_json.action }}"
    id: down_hold

  - platform: mqtt
    topic: "{{ mqtt_topic }}"
    payload: "recall_0"
    value_template: "{{ value_json.action }}"
    id: hue_cycle

  - platform: mqtt
    topic: "{{ mqtt_topic }}"
    payload: "recall_1"
    value_template: "{{ value_json.action }}"
    id: hue_cycle

action:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - toggle_on
              - toggle_off
        sequence:
          - service: light.toggle
            target:
              entity_id: "{{ target_lights }}"

      - conditions:
          - condition: trigger
            id: up_press
        sequence:
          - variables:
              first_light: "{{ expand(target_lights) | map(attribute='entity_id') | list | first }}"
              current_brightness: "{{ state_attr(first_light, 'brightness') | int(0) }}"
              step_brightness: "{{ ((short_step_pct | float) * 2.55) | round(0) | int }}"
              new_brightness: "{{ [current_brightness + step_brightness, 255] | min }}"
          - service: light.turn_on
            target:
              entity_id: "{{ target_lights }}"
            data:
              brightness: "{{ new_brightness }}"

      - conditions:
          - condition: trigger
            id: down_press
        sequence:
          - variables:
              first_on_light: >-
                {{ expand(target_lights)
                   | selectattr('state', 'eq', 'on')
                   | map(attribute='entity_id')
                   | list
                   | first }}
          - condition: template
            value_template: "{{ first_on_light is not none }}"
          - variables:
              current_brightness: "{{ state_attr(first_on_light, 'brightness') | int(1) }}"
              step_brightness: "{{ ((short_step_pct | float) * 2.55) | round(0) | int }}"
              new_brightness: "{{ [current_brightness - step_brightness, 1] | max }}"
          - service: light.turn_on
            target:
              entity_id: "{{ target_lights }}"
            data:
              brightness: "{{ new_brightness }}"

      - conditions:
          - condition: trigger
            id: up_hold
        sequence:
          - repeat:
              sequence:
                - variables:
                    first_light: "{{ expand(target_lights) | map(attribute='entity_id') | list | first }}"
                    current_brightness: "{{ state_attr(first_light, 'brightness') | int(0) }}"
                    step_brightness: "{{ ((hold_step_pct | float) * 2.55) | round(0) | int }}"
                    new_brightness: "{{ [current_brightness + step_brightness, 255] | min }}"
                - service: light.turn_on
                  target:
                    entity_id: "{{ target_lights }}"
                  data:
                    brightness: "{{ new_brightness }}"
                - wait_for_trigger:
                    - platform: mqtt
                      topic: "{{ mqtt_topic }}"
                      payload: "up_hold_release"
                      value_template: "{{ value_json.action }}"
                  timeout:
                    milliseconds: "{{ hold_delay_ms }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"

      - conditions:
          - condition: trigger
            id: down_hold
        sequence:
          - variables:
              first_on_light: >-
                {{ expand(target_lights)
                   | selectattr('state', 'eq', 'on')
                   | map(attribute='entity_id')
                   | list
                   | first }}
          - condition: template
            value_template: "{{ first_on_light is not none }}"
          - repeat:
              sequence:
                - variables:
                    current_brightness: "{{ state_attr(first_on_light, 'brightness') | int(1) }}"
                    step_brightness: "{{ ((hold_step_pct | float) * 2.55) | round(0) | int }}"
                    new_brightness: "{{ [current_brightness - step_brightness, 1] | max }}"
                - service: light.turn_on
                  target:
                    entity_id: "{{ target_lights }}"
                  data:
                    brightness: "{{ new_brightness }}"
                - wait_for_trigger:
                    - platform: mqtt
                      topic: "{{ mqtt_topic }}"
                      payload: "down_hold_release"
                      value_template: "{{ value_json.action }}"
                  timeout:
                    milliseconds: "{{ hold_delay_ms }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: "{{ wait.trigger is not none }}"

      - conditions:
          - condition: trigger
            id: hue_cycle
        sequence:
          - variables:
              current_index: "{{ states(color_helper) | int(0) }}"
              color_index: "{{ current_index % 9 }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 0 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [255, 255, 255]

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 1 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [245, 245, 80]

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 2 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [255, 179, 44]

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 3 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [255, 80, 40]

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 4 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [235, 60, 120]

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 5 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [160, 50, 255]

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 6 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [40, 60, 255]

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 7 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [45, 110, 170]

              - conditions:
                  - condition: template
                    value_template: "{{ color_index == 8 }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: "{{ target_lights }}"
                    data:
                      rgb_color: [110, 235, 70]

          - service: input_number.set_value
            target:
              entity_id: "{{ color_helper }}"
            data:
              value: "{{ (current_index + 1) % 9 }}"
